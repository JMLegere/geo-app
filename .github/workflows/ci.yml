name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  design-contract:
    name: Design contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run spec:ui596:check
      - run: npm run design:check

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --no-fatal-infos

  eac:
    name: EAC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - uses: jdx/mise-action@v2
        with:
          install: false
          cache: true

      - run: flutter pub get

      - name: Install EAC
        run: mise install github:JMLegere/eac

      - name: Run EAC check
        run: |
          EAC_BIN="$(mise which eac)"
          export PATH="$(dirname "$EAC_BIN"):$PATH"
          npm run eac:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::No coverage file generated"
            exit 1
          fi

          # Exclude UI, concrete Supabase adapters, and abstract domain ports:
          # the latter declare boundaries and safe value types but contain no
          # executable production implementation.
          python3 -c "
          import re
          with open('coverage/lcov.info') as f:
              content = f.read()
          records = content.split('end_of_record')
          exclude_patterns = [
              r'supabase_.*_repository\.dart',
              r'supabase_.*_adapter\.dart',
              r'presentation/screens/.*\.dart',
              r'presentation/widgets/.*\.dart',
              r'presentation/painters/.*\.dart',
              r'domain/repositories/.*\.dart',
              r'ui/product_surfaces/.*/screens/.*\.dart',
              r'ui/product_surfaces/.*/widgets/.*\.dart',
              r'ui/product_surfaces/map/rendering/(cell_overlay_painter|fog_renderer|player_marker)\.dart',
          ]
          filtered = []
          for r in records:
              if not r.strip():
                  continue
              if not any(re.search(p, r) for p in exclude_patterns):
                  filtered.append(r)
          with open('coverage/lcov.info', 'w') as f:
              f.write('end_of_record\n'.join(filtered) + ('end_of_record\n' if filtered else ''))
          "

          # Count lines
          TOTAL=$(grep -c 'DA:' coverage/lcov.info || echo 0)
          HIT=$(grep 'DA:' coverage/lcov.info | grep -cv ',0$' || echo 0)

          if [ "$TOTAL" -eq 0 ]; then
            echo "::error::No coverage data found"
            exit 1
          fi

          PCT=$(( HIT * 100 / TOTAL ))
          echo "Coverage: $HIT/$TOTAL lines = ${PCT}%"

          # Fail if covered lines < 95% of total (avoids integer division rounding)
          THRESHOLD=$(( TOTAL * 95 / 100 ))
          if [ "$HIT" -lt "$THRESHOLD" ]; then
            echo "::error::Coverage ${PCT}% ($HIT/$TOTAL) is below 95% threshold (need $THRESHOLD)"
            exit 1
          fi

          echo "✅ Coverage ${PCT}% ($HIT/$TOTAL) meets 95% threshold (need $THRESHOLD)"

  widgetbook:
    name: Widgetbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Resolve isolated workshop
        working-directory: widgetbook
        run: flutter pub get

      - name: Verify generated catalog
        working-directory: widgetbook
        run: |
          dart run build_runner build
          test -f lib/main.directories.g.dart
          git diff --exit-code -- lib/main.directories.g.dart

      - name: Analyze workshop
        working-directory: widgetbook
        run: flutter analyze --no-pub

      - name: Test catalog, fixtures, and native visuals
        working-directory: widgetbook
        run: flutter test --no-pub test/catalog_contract_test.dart test/fixture_safety_test.dart test/visual_goldens_test.dart

      - name: Build offline workshop
        working-directory: widgetbook
        run: flutter build web --no-pub --no-web-resources-cdn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widgetbook
          path: |
            widgetbook/build/web
            widgetbook/test/goldens/native
            widgetbook/test/failures

  widgetbook-browser:
    name: Widgetbook browser visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: 153.0.8010.36
          install-chromedriver: true
          install-dependencies: true

      - name: Resolve isolated workshop
        working-directory: widgetbook
        run: flutter pub get

      - name: Capture and compare composited MapLibre visual
        working-directory: widgetbook
        env:
          CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.chrome.outputs.chromedriver-path }}
          BROWSER_GOLDEN_ENV: chrome-driver-153-mobile-emulation-131-linux-swiftshader
        run: |
          "$CHROMEDRIVER_BINARY" --port=4444 --url-base=wd/hub &
          DRIVER_PID=$!
          trap 'kill "$DRIVER_PID"' EXIT
          for VIEWPORT in wide narrow; do
            if [ "$VIEWPORT" = narrow ]; then
              DIMENSION=390x844@1
            else
              DIMENSION=1440x1000@1
            fi
            flutter drive \
              --no-pub \
              --driver=test_driver/map_visual_test.dart \
              --target=integration_test/map_visual_test.dart \
              --dart-define=BROWSER_GOLDEN_ENV="$BROWSER_GOLDEN_ENV" \
              --dart-define=BROWSER_GOLDEN_VIEWPORT="$VIEWPORT" \
              -d web-server \
              --driver-port=4444 \
              --browser-name=chrome \
              --chrome-binary="$CHROME_BINARY" \
              --headless \
              --browser-dimension="$DIMENSION" \
              --no-web-resources-cdn \
              --web-browser-flag=--no-sandbox \
              --web-browser-flag=--enable-gpu \
              --web-browser-flag=--use-angle=swiftshader \
              --web-browser-flag=--enable-unsafe-swiftshader
          done
          flutter test --no-pub \
            --dart-define=BROWSER_GOLDEN_ENV="$BROWSER_GOLDEN_ENV" \
            test/browser_golden_test.dart

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widgetbook-browser-visual
          path: |
            widgetbook/artifacts/widgetbook/actual
            widgetbook/test/goldens/browser
            widgetbook/test/failures
